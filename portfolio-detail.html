<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do projeto</title>
<style>
  :root{
    --bg-dark: #191514;
    --white: #ffffff;
    --accent-red: #fb022d;
    --accent-red-light: #ff3a56;
    --accent-maroon: #720521;
    --overlay-grey: rgba(63,60,59,0.35);
    --overlay-white: rgba(255,255,255,0.08);
    --text-onwhite: #160f0f;
    --radius: 8px;
    --container: 1080px;
    --font-display: "ZT Nature", sans-serif;
    --font-pixel: "Press Start 2P", monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
      var(--bg-dark);
    background-size: 26px 26px, 26px 26px, auto;
    color:var(--white);
    font-family:var(--font-display);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{ max-width:100%; display:block; }
  a, button{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--container); margin-inline:auto; padding-inline:1.25rem; }
  .page-shell{ padding:3rem 0 5rem; }

  header.site-header{ background:var(--accent-red); padding:0; }
  .site-header .wrap{ max-width:1222px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem; }
  .logo-mark{ display:flex; align-items:center; }
  .logo-mark img{ height:100px; width:auto; }
  nav.primary-nav ul{ list-style:none; display:flex; gap:clamp(1rem,3vw,3.6rem); flex-wrap:wrap; }
  nav.primary-nav a{ font-size:clamp(1rem,1.6vw,1.4rem); font-weight:400; }
  nav.primary-nav a.is-current{ font-weight:700; }
  nav.primary-nav a:hover{ opacity:0.75; }
  @media (max-width:760px){
    header.site-header{ padding:0.9rem 0; }
    .site-header .wrap{ justify-content:center; gap:0.8rem; }
    .logo-mark{ width:100%; justify-content:center; }
    .logo-mark img{ height:72px; }
    nav.primary-nav{ width:100%; }
    nav.primary-nav ul{ justify-content:center; gap:0.8rem 1.2rem; }
    nav.primary-nav a{ font-size:0.95rem; letter-spacing:0.02em; }
  }

  .detail-card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .detail-hero{
    min-height:380px;
    background-size:cover;
    background-position:center;
    position:relative;
  }
  .detail-hero video{ width:100%; height:100%; min-height:380px; object-fit:cover; display:block; }
  .detail-hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0.42));
  }
  .detail-content{ padding:2rem clamp(1.2rem,3vw,3rem) 3rem; }
  .eyebrow{ font-family:var(--font-pixel); font-size:0.66rem; letter-spacing:0.08em; text-transform:lowercase; color:var(--accent-red-light); margin-bottom:0.9rem; }
  .detail-title{ font-size:clamp(2rem,4vw,4rem); line-height:0.98; font-style:italic; font-weight:700; margin-bottom:1rem; }
  .detail-meta{ display:flex; flex-wrap:wrap; gap:0.7rem 1.2rem; color:rgba(255,255,255,0.72); font-size:0.85rem; margin-bottom:1.5rem; }
  .detail-grid{
    display:grid;
    grid-template-columns:1.2fr 0.8fr;
    gap:2rem;
  }
  .detail-copy h3, .detail-side h3{
    font-size:0.9rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-family:var(--font-pixel);
    color:var(--accent-red-light);
    margin-bottom:0.8rem;
  }
  .detail-copy p{
    margin-bottom:1rem;
    opacity:0.9;
    font-size:1.05rem;
  }
  .detail-side{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius);
    padding:1.2rem;
  }
  .detail-side ul{ list-style:none; display:grid; gap:0.8rem; }
  .detail-side li{ display:grid; gap:0.2rem; }
  .detail-side strong{ font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; font-family:var(--font-pixel); color:rgba(255,255,255,0.7); }
  .detail-side span{ font-size:1rem; }

  .gallery-strip{
    margin-top:2rem;
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:1rem;
  }
  .mini-shot{
    min-height:200px;
    background-size:cover;
    background-position:center;
    border-radius:var(--radius);
    border:1px solid rgba(255,255,255,0.08);
  }
  .mini-shot video{ width:100%; height:100%; min-height:200px; object-fit:cover; display:block; border-radius:var(--radius); }

  @media (max-width:820px){
    .detail-grid{ grid-template-columns:1fr; }
    .gallery-strip{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo-mark" href="index.html" aria-label="fel[lype] ferreira — início">
      <img src="assets/img/logo.png" alt="fel[lype] ferreira">
    </a>
    <nav class="primary-nav" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">início</a></li>
        <li><a href="fotografia.html">fotografia</a></li>
        <li><a href="design.html">design</a></li>
        <li><a href="conteudo.html">conteúdo</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="page-shell">
  <div class="wrap">
    <article class="detail-card">
      <div class="detail-hero" id="detailHero" aria-label="Imagem principal do projeto"></div>
      <div class="detail-content">
        <div class="eyebrow" id="detailType">portfolio / projeto</div>
        <h1 class="detail-title" id="detailTitle">Projeto</h1>
        <div class="detail-meta">
          <span id="detailDate">Data</span>
          <span id="detailCategory">Categoria</span>
        </div>

        <div class="detail-grid">
          <div class="detail-copy">
            <h3>o que o cliente estava buscando</h3>
            <div id="detailBrief"></div>
          </div>

          <aside class="detail-side">
            <h3>resumo</h3>
            <ul>
              <li>
                <strong>cliente</strong>
                <span id="detailClient">—</span>
              </li>
              <li>
                <strong>objetivo</strong>
                <span id="detailGoal">—</span>
              </li>
              <li>
                <strong>resultado</strong>
                <span id="detailResult">—</span>
              </li>
            </ul>
          </aside>
        </div>

        <div class="gallery-strip" id="detailGallery"></div>
      </div>
    </article>
  </div>
</main>

<script src="site-data.js"></script>
<script>
  function escapeHtml(value){
    return String(value || '').replace(/[&<>"']/g, function(character){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character];
    });
  }

  var categoryLabels = { design: 'design', conteudo: 'conteúdo', rua: 'fotos de rua', editorial: 'fotos editoriais' };

  function mediaTag(src, className){
    if (PortfolioData.isVideo(src)) {
      return '<div class="' + className + '"><video src="' + escapeHtml(src) + '" controls playsinline></video></div>';
    }
    return '<div class="' + className + '" style="background-image:url(\'' + escapeHtml(src) + '\')"></div>';
  }

  function renderProject(){
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var project = PortfolioData.getPost(id) || PortfolioData.getPostsByType('fotografia')[0];

    if (!project) return;

    document.title = project.title + ' — fel[lype] ferreira';
    document.getElementById('detailType').textContent = 'portfolio / ' + project.type;
    document.getElementById('detailTitle').textContent = project.title;
    document.getElementById('detailDate').textContent = project.displayDate;
    document.getElementById('detailCategory').textContent = categoryLabels[project.category] || categoryLabels[project.type] || project.type;
    document.getElementById('detailClient').textContent = project.client || '—';
    document.getElementById('detailGoal').textContent = project.goal || '—';
    document.getElementById('detailResult').textContent = project.result || '—';

    var briefWrap = document.getElementById('detailBrief');
    briefWrap.innerHTML = (project.brief || []).map(function(text){
      return '<p>' + escapeHtml(text) + '</p>';
    }).join('');

    var hero = document.getElementById('detailHero');
    hero.innerHTML = '';
    if (PortfolioData.isVideo(project.hero)) {
      hero.style.backgroundImage = 'none';
      hero.innerHTML = '<video src="' + escapeHtml(project.hero) + '" controls playsinline></video>';
    } else {
      hero.style.backgroundImage = 'url("' + escapeHtml(project.hero) + '")';
    }

    var gallery = document.getElementById('detailGallery');
    var galleryItems = (project.gallery && project.gallery.length) ? project.gallery : [project.hero];
    gallery.innerHTML = galleryItems.map(function(src){ return mediaTag(src, 'mini-shot'); }).join('');
  }

  PortfolioData.ready.then(renderProject);
</script>
<script src="language.js"></script>
</body>
</html>
