<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>conteúdo — fel[lype] ferreira</title>
<style>
  :root{
    --bg-dark: #191514;
    --white: #ffffff;
    --accent-red: #fb022d;
    --accent-red-light: #ff3a56;
    --accent-maroon: #720521;
    --overlay-grey: rgba(63,60,59,0.35);
    --overlay-white: rgba(255,255,255,0.08);
    --text-onwhite: #160f0f;
    --radius: 8px;
    --container: 1080px;
    --font-display: "ZT Nature", sans-serif;
    --font-pixel: "Press Start 2P", monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
      var(--bg-dark);
    background-size: 26px 26px, 26px 26px, auto;
    color:var(--white);
    font-family:var(--font-display);
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{ max-width:100%; display:block; }
  a, button{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--container); margin-inline:auto; padding-inline:1.25rem; }
  .page-shell{ padding:3rem 0 5rem; }
  .eyebrow{ font-family:var(--font-pixel); font-size:0.7rem; letter-spacing:0.08em; text-transform:lowercase; opacity:0.75; margin-bottom:1rem; }
  .page-header{ margin-bottom:2.25rem; }
  .page-header h1{ font-size:clamp(1.8rem,3vw,2.8rem); line-height:0.96; font-style:italic; font-weight:700; margin-bottom:0.8rem; }
  .page-header p{ max-width:52ch; opacity:0.82; font-size:clamp(1rem,1.8vw,1.32rem); }

  header.site-header{ background:var(--accent-red); padding:0; }
  .site-header .wrap{ max-width:1222px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem; }
  .logo-mark{ display:flex; align-items:center; }
  .logo-mark img{ height:100px; width:auto; }
  nav.primary-nav ul{ list-style:none; display:flex; gap:clamp(1rem,3vw,3.6rem); flex-wrap:wrap; }
  nav.primary-nav a{ font-size:clamp(1rem,1.6vw,1.4rem); font-weight:400; }
  nav.primary-nav a.is-current{ font-weight:700; }
  nav.primary-nav a:hover{ opacity:0.75; }
  @media (max-width:760px){
    header.site-header{ padding:0.9rem 0; }
    .site-header .wrap{ justify-content:center; gap:0.8rem; }
    .logo-mark{ width:100%; justify-content:center; }
    .logo-mark img{ height:72px; }
    nav.primary-nav{ width:100%; }
    nav.primary-nav ul{ justify-content:center; gap:0.8rem 1.2rem; }
    nav.primary-nav a{ font-size:0.95rem; letter-spacing:0.02em; }
  }

  .posts-list{ display:grid; gap:1.25rem; }
  .post-card{
    display:grid;
    grid-template-columns:220px minmax(0, 1fr);
    gap:1.2rem;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius);
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
  }
  .post-card:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,0.18); }
  .post-thumb{
    min-height:180px;
    background-size:cover;
    background-position:center;
  }
  .post-thumb video{ width:100%; height:100%; min-height:180px; object-fit:cover; display:block; }
  .post-content{ padding:1rem 1.1rem 1.1rem 0; display:flex; flex-direction:column; justify-content:center; }
  .meta{ font-family:var(--font-pixel); font-size:0.56rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-red-light); margin-bottom:0.6rem; }
  .post-content h2{ font-size:clamp(1.35rem,2.4vw,2.1rem); line-height:1.06; font-weight:700; font-style:italic; margin-bottom:0.6rem; }
  .post-content p{ opacity:0.82; font-size:1rem; max-width:52ch; }
  .thumb-a{ background-image:url('conteúdo.jpg'); }
  .thumb-b{ background-image:url('assets/img/card-design.jpg'); }
  .thumb-c{ background-image:url('assets/img/card-fotografia.jpg'); }
  .thumb-d{ background-image:url('conteúdo.jpg'); }

  @media (max-width:720px){
    .post-card{ grid-template-columns:1fr; }
    .post-thumb{ min-height:220px; }
    .post-content{ padding:0 1rem 1.1rem; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo-mark" href="index.html" aria-label="fel[lype] ferreira — início">
      <img src="assets/img/logo.png" alt="fel[lype] ferreira">
    </a>
    <nav class="primary-nav" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">início</a></li>
        <li><a href="fotografia.html">fotografia</a></li>
        <li><a href="design.html">design</a></li>
        <li><a href="conteudo.html" class="is-current">conteúdo</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="page-shell">
  <div class="wrap">
    <div class="page-header">
      <div class="eyebrow">portfolio / conteúdo</div>
      <h1>conteúdo</h1>
      <p>Textos, ideias e reflexões organizadas para serem lidas, compartilhadas e revisitadas.</p>
    </div>

    <div class="posts-list" id="postsList"></div>
  </div>
<script src="site-data.js"></script>
<script>
  function escapeHtml(value){
    return String(value || '').replace(/[&<>"']/g, function(character){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character];
    });
  }

  PortfolioData.ready.then(function(){
    var list = document.getElementById('postsList');
    list.innerHTML = PortfolioData.getPostsByType('conteudo').map(function(post){
      var thumbInner = PortfolioData.isVideo(post.hero)
        ? '<video src="' + escapeHtml(post.hero) + '" muted playsinline></video>'
        : '';
      var thumbStyle = PortfolioData.isVideo(post.hero) ? '' : ' style="background-image:url(\'' + escapeHtml(post.hero) + '\')"';
      return '<a class="post-card" href="portfolio-detail.html?type=conteudo&id=' + encodeURIComponent(post.id) + '">' +
        '<div class="post-thumb"' + thumbStyle + ' aria-label="' + escapeHtml(post.title) + '">' + thumbInner + '</div>' +
        '<div class="post-content"><div class="meta">' + escapeHtml(post.displayDate) + '</div><h2>' + escapeHtml(post.title) + '</h2><p>' + escapeHtml(post.description) + '</p></div>' +
        '</a>';
    }).join('');
  });
</script>
</main>
<script src="language.js"></script>
</body>
</html>
