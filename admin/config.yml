backend:
  name: git-gateway
  branch: main

# O Netlify Identity cuida do login. Sem isso não tem chave nem servidor pra manter.
local_backend: false

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "design"
    label: "Design"
    label_singular: "post de Design"
    files:
      - name: "design"
        label: "Posts de Design"
        file: "content/design.json"
        fields:
          - { label: "Posts", name: "posts", widget: "list", label_singular: "Post", summary: "{{fields.title}}", fields:
              - { label: "ID (nao repetir, sem espaco)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "use so letras minusculas e numeros"] }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Imagem ou vídeo de capa", name: "hero", widget: "file" }
              - { label: "Descrição curta (aparece na listagem)", name: "description", widget: "text" }
              - { label: "Cliente", name: "client", widget: "string", required: false }
              - { label: "Objetivo", name: "goal", widget: "string", required: false }
              - { label: "Resultado", name: "result", widget: "string", required: false }
              - { label: "Texto do projeto (parágrafos)", name: "brief", widget: "list", field: { label: "Parágrafo", name: "paragraph", widget: "text" } }
              - { label: "Galeria (imagens ou vídeos)", name: "gallery", widget: "list", field: { label: "Arquivo", name: "item", widget: "file" }, required: false }
            }

  - name: "conteudo"
    label: "Conteúdo"
    label_singular: "post de Conteúdo"
    files:
      - name: "conteudo"
        label: "Posts de Conteúdo"
        file: "content/conteudo.json"
        fields:
          - { label: "Posts", name: "posts", widget: "list", label_singular: "Post", summary: "{{fields.title}}", fields:
              - { label: "ID (não repetir, sem espaço)", name: "id", widget: "string", pattern: ['^[a-z0-9-]+$', "use só letras minúsculas, números e hífen"] }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Imagem ou vídeo de capa", name: "hero", widget: "file" }
              - { label: "Descrição curta (aparece na listagem)", name: "description", widget: "text" }
              - { label: "Cliente", name: "client", widget: "string", required: false }
              - { label: "Objetivo", name: "goal", widget: "string", required: false }
              - { label: "Resultado", name: "result", widget: "string", required: false }
              - { label: "Texto do projeto (parágrafos)", name: "brief", widget: "list", field: { label: "Parágrafo", name: "paragraph", widget: "text" } }
              - { label: "Galeria (imagens ou vídeos)", name: "gallery", widget: "list", field: { label: "Arquivo", name: "item", widget: "file" }, required: false }
            }

  - name: "fotografia"
    label: "Fotografia"
    label_singular: "post de Fotografia"
    files:
      - name: "fotografia"
        label: "Posts de Fotografia"
        file: "content/fotografia.json"
        fields:
          - { label: "Posts", name: "posts", widget: "list", label_singular: "Post", summary: "{{fields.title}}", fields:
              - { label: "ID (não repetir, sem espaço)", name: "id", widget: "string", pattern: ['^[a-z0-9-]+$', "use só letras minúsculas, números e hífen"] }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Categoria", name: "category", widget: "select", options: [{ label: "Fotos de rua", value: "rua" }, { label: "Fotos editoriais", value: "editorial" }] }
              - { label: "Imagem ou vídeo de capa", name: "hero", widget: "file" }
              - { label: "Cliente", name: "client", widget: "string", required: false }
              - { label: "Objetivo", name: "goal", widget: "string", required: false }
              - { label: "Resultado", name: "result", widget: "string", required: false }
              - { label: "Texto do projeto (parágrafos)", name: "brief", widget: "list", field: { label: "Parágrafo", name: "paragraph", widget: "text" } }
              - { label: "Galeria (imagens ou vídeos)", name: "gallery", widget: "list", field: { label: "Arquivo", name: "item", widget: "file" }, required: false }
            }
