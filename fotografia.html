<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fotografia — fel[lype] ferreira</title>
<style>
  :root{
    --bg-dark: #191514;
    --white: #ffffff;
    --accent-red: #fb022d;
    --accent-red-light: #ff3a56;
    --accent-maroon: #720521;
    --overlay-grey: rgba(63,60,59,0.35);
    --overlay-white: rgba(255,255,255,0.08);
    --text-onwhite: #160f0f;
    --radius: 8px;
    --container: 1080px;
    --font-display: "ZT Nature", sans-serif;
    --font-pixel: "Press Start 2P", monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
      var(--bg-dark);
    background-size: 26px 26px, 26px 26px, auto;
    color:var(--white);
    font-family:var(--font-display);
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{ max-width:100%; display:block; }
  a, button{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--container); margin-inline:auto; padding-inline:1.25rem; }
  .page-shell{ padding:3rem 0 5rem; }
  .eyebrow{ font-family:var(--font-pixel); font-size:0.7rem; letter-spacing:0.08em; text-transform:lowercase; opacity:0.75; margin-bottom:1rem; }
  .page-header{ margin-bottom:2.25rem; }
  .page-header h1{
    font-size:clamp(1.8rem,3vw,2.8rem);
    line-height:0.96;
    font-style:italic;
    font-weight:700;
    margin-bottom:0.8rem;
  }
  .page-header p{ max-width:52ch; opacity:0.82; font-size:clamp(1rem,1.8vw,1.32rem); }

  header.site-header{ background:var(--accent-red); padding:0; }
  .site-header .wrap{ max-width:1222px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem; }
  .logo-mark{ display:flex; align-items:center; }
  .logo-mark img{ height:100px; width:auto; }
  nav.primary-nav ul{ list-style:none; display:flex; gap:clamp(1rem,3vw,3.6rem); flex-wrap:wrap; }
  nav.primary-nav a{ font-size:clamp(1rem,1.6vw,1.4rem); font-weight:400; }
  nav.primary-nav a.is-current{ font-weight:700; }
  nav.primary-nav a:hover{ opacity:0.75; }
  @media (max-width:760px){
    header.site-header{ padding:0.9rem 0; }
    .site-header .wrap{ justify-content:center; gap:0.8rem; }
    .logo-mark{ width:100%; justify-content:center; }
    .logo-mark img{ height:72px; }
    nav.primary-nav{ width:100%; }
    nav.primary-nav ul{ justify-content:center; gap:0.8rem 1.2rem; }
    nav.primary-nav a{ font-size:0.95rem; letter-spacing:0.02em; }
  }

  .filters{ display:flex; flex-wrap:wrap; gap:0.8rem; margin-bottom:2rem; }
  .filter-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    color:var(--white);
    padding:0.7rem 1rem;
    font-size:0.9rem;
    font-weight:700;
    letter-spacing:0.02em;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .filter-btn.is-active,
  .filter-btn:hover{
    background:var(--accent-red);
    border-color:rgba(255,255,255,0.3);
    transform:translateY(-1px);
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:1.35rem;
  }
  @media (max-width:920px){ .gallery-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:640px){ .gallery-grid{ grid-template-columns:1fr; } }

  .gallery-item{
    display:block;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:var(--radius);
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .gallery-item:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,0.2);
    box-shadow:0 12px 30px rgba(0,0,0,0.18);
  }
  .gallery-item.hidden{ display:none; }
  .gallery-thumb{
    height:290px;
    background-size:cover;
    background-position:center;
    position:relative;
  }
  .gallery-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumb::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0.35));
  }
  .gallery-meta{ padding:1rem 1rem 1.2rem; }
  .gallery-tag{
    display:inline-block;
    font-family:var(--font-pixel);
    font-size:0.56rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-red-light);
    margin-bottom:0.55rem;
  }
  .gallery-item h3{
    font-weight:700;
    font-size:clamp(1.2rem,2vw,1.7rem);
    line-height:1.1;
    margin:0;
  }
  .thumb-1{ background-image:url('assets/img/card-fotografia.jpg'); }
  .thumb-2{ background-image:url('assets/img/card-design.jpg'); }
  .thumb-3{ background-image:url('assets/img/card-conteudo.jpg'); }
  .thumb-4{ background-image:url('assets/img/card-fotografia.jpg'); }
  .thumb-5{ background-image:url('assets/img/card-design.jpg'); }
  .thumb-6{ background-image:url('assets/img/card-conteudo.jpg'); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo-mark" href="index.html" aria-label="fel[lype] ferreira — início">
      <img src="assets/img/logo.png" alt="fel[lype] ferreira">
    </a>
    <nav class="primary-nav" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">início</a></li>
        <li><a href="fotografia.html" class="is-current">fotografia</a></li>
        <li><a href="design.html">design</a></li>
        <li><a href="conteudo.html">conteúdo</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="page-shell">
  <div class="wrap">
    <div class="page-header">
      <div class="eyebrow">portfolio / fotografia</div>
      <h1>fotografia</h1>
      <p>Uma coleção de registros que atravessam rua, pessoas, luz e narrativa visual.</p>
    </div>

    <div class="filters" aria-label="Filtrar fotografias">
      <button class="filter-btn is-active" type="button" data-filter="all">todas</button>
      <button class="filter-btn" type="button" data-filter="rua">fotos de rua</button>
      <button class="filter-btn" type="button" data-filter="editorial">fotos editoriais</button>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</main>

<script src="site-data.js"></script>
<script>
  function escapeHtml(value){
    return String(value || '').replace(/[&<>"']/g, function(character){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character];
    });
  }

  PortfolioData.ready.then(function(){
    var grid = document.getElementById('galleryGrid');
    grid.innerHTML = PortfolioData.getPostsByType('fotografia').map(function(post){
      var thumbInner = PortfolioData.isVideo(post.hero)
        ? '<video src="' + escapeHtml(post.hero) + '" muted playsinline></video>'
        : '';
      var thumbStyle = PortfolioData.isVideo(post.hero) ? '' : ' style="background-image:url(\'' + escapeHtml(post.hero) + '\')"';
      var tag = post.category === 'rua' ? 'fotos de rua' : 'fotos editoriais';
      return '<a class="gallery-item" data-category="' + escapeHtml(post.category) + '" href="portfolio-detail.html?type=fotografia&id=' + encodeURIComponent(post.id) + '">' +
        '<div class="gallery-thumb"' + thumbStyle + ' aria-label="' + escapeHtml(post.title) + '">' + thumbInner + '</div>' +
        '<div class="gallery-meta"><span class="gallery-tag">' + escapeHtml(tag) + '</span><h3>' + escapeHtml(post.title) + '</h3></div>' +
        '</a>';
    }).join('');

    var filterButtons = document.querySelectorAll('.filter-btn');
    var items = document.querySelectorAll('.gallery-item');

    filterButtons.forEach(function(button){
      button.addEventListener('click', function(){
        var filter = button.dataset.filter;
        filterButtons.forEach(function(btn){ btn.classList.toggle('is-active', btn === button); });
        items.forEach(function(item){
          var match = filter === 'all' || item.dataset.category === filter;
          item.classList.toggle('hidden', !match);
        });
      });
    });
  });
</script>
<script src="language.js"></script>
</body>
</html>
